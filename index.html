<!DOCTYPE html>
<html amp lang="pt-BR">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Portal de Jogos FPS</title>  
  <meta name="description" content="Portal de Jogos FPS: jogue online grátis FPS, aventura, estratégia e mais diretamente no navegador.">  

  <!-- AMP obrigatório -->
  <script async src="https://cdn.ampproject.org/v0.js"></script>

  <!-- AMP Auto Ads -->

  <style amp-custom>  
    /* === SEU CSS ORIGINAL COMPLETO FOI MANTIDO === */
    body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #0f0f0f, #1a1a1a); color: white; display: flex; flex-direction: column; min-height: 100vh; user-select: none; transition: background 0.4s, color 0.4s; }
    header { text-align: center; background: #1b1b1b; padding: 20px 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; position: relative; }
    header h1 { font-size: 2rem; color: #ff4500; }
    .theme-toggle { position: absolute; top: 20px; right: 20px; background: #ff4500; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .theme-toggle:hover { background: #ffcc00; color: #111; }
    .navbar { display: flex; justify-content: center; background: #111; padding: 10px; gap: 15px; flex-wrap: wrap; }
    .navbar a { color: white; text-decoration: none; font-weight: bold; padding: 8px 15px; transition: 0.3s; }
    .navbar a:hover { background: #ff4500; border-radius: 5px; color: #111; }
    .hero-banner { background: #222; border-radius: 12px; padding: 20px; text-align: center; font-size: 1.3rem; color: #ffcc00; box-shadow: 0 4px 15px rgba(0,0,0,0.6); margin-bottom: 20px; animation: glow 2s infinite alternate; }
    @keyframes glow { from { text-shadow: 0 0 10px #ffcc00; } to { text-shadow: 0 0 25px #ff4500; } }
    #online-counter { display: block; font-size: 1rem; color: #0f0; margin-top: 8px; }
    #clock { margin-top: 8px; font-size: 0.95rem; color: #0ff; }
    #visit-counter { margin-top: 5px; font-size: 0.9rem; color: #ffcc00; }
    .container { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 20px; flex-direction: column; gap: 20px; }
    .ad-top, .ad-bottom { background: #111; border-radius: 10px; padding: 15px; text-align: center; }
    .game-card { position: relative; width: 100%; height: calc(100vh - 300px); max-width: 1200px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.7); background: #1a1a1a; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; pointer-events: auto; transition: transform 0.3s; }
    .fullscreen-btn { position: fixed; bottom: 20px; right: 20px; padding: 12px 25px; background: #ff4500; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 1rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; z-index: 999; }
    .fullscreen-btn:hover { background: #ff6347; transform: scale(1.1); box-shadow: 0 0 20px #ff4500; }
    .game-description { text-align: center; margin-top: 10px; font-size: 1.1rem; color: #ccc; max-width: 800px; margin-left: auto; margin-right: auto; line-height: 1.5; }
    .featured-games { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .featured-game { width: 180px; height: 100px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 0.9rem; transition: 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .featured-game:hover { background: #ff4500; transform: scale(1.05); }
    .recent-games { margin-top: 40px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
    .recent-game-card { width: 350px; height: 200px; background: #222; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: transform 0.3s, box-shadow 0.3s; }
    .recent-game-card:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255,69,0,0.7); }
    .recent-game-card iframe { width: 100%; height: 100%; border: none; }
    footer { background: #111; padding: 20px; text-align: center; font-size: 0.9rem; color: #ccc; margin-top: auto; }
    footer a { color: #ff4500; text-decoration: none; margin: 0 10px; }
    footer a:hover { text-decoration: underline; }
    @media(max-width: 900px){ .game-card { height: 60vh; } iframe { height: 100%; } .recent-game-card { width: 80%; height: 180px; } }
    @media(max-width: 600px){ .game-card { height: 50vh; } iframe { height: 100%; } .recent-game-card { width: 100%; height: 160px; } }
    #blocked-overlay { display: none; position: fixed; inset: 0; background: #000; color: #fff; z-index: 99999; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #cookie-banner { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(17,17,17,0.95); color: #fff; padding: 15px; text-align: center; font-size: 0.95rem; box-shadow: 0 -4px 15px rgba(0,0,0,0.6); display: none; z-index: 10000; }
    #cookie-banner button { background: #ff4500; border: none; padding: 8px 15px; margin-left: 10px; border-radius: 5px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #cookie-banner button:hover { background: #ffcc00; color: #111; }
    .light-mode { background: linear-gradient(135deg, #f4f4f4, #eaeaea); color: #111; }
    .light-mode header { background: #f1f1f1; }
    .light-mode .navbar { background: #ddd; }
    .light-mode .navbar a { color: #111; }
    .light-mode .featured-game { background: #eee; color: #111; }
    .light-mode .game-card { background: #f9f9f9; }
    .light-mode .recent-game-card { background: #f0f0f0; }
    .light-mode footer { background: #ddd; color: #111; }
    #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }
    .contact-form { max-width: 600px; margin: 40px auto; background: #1a1a1a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    .contact-form h2 { text-align: center; color: #ffcc00; margin-bottom: 15px; }
    .contact-form input, .contact-form textarea { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 6px; font-size: 1rem; }
    .contact-form button { background: #ff4500; border: none; padding: 10px 15px; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    .contact-form button:hover { background: #ffcc00; color: #111; }
    .contact-buttons { text-align: center; margin-top: 15px; }
    .contact-buttons a { display: inline-block; margin: 5px; padding: 10px 15px; background: #25d366; color: #fff; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.3s; }
    .contact-buttons a.email { background: #0072c6; }
    .contact-buttons a:hover { opacity: 0.8; }
  </style>
